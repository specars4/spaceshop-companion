[package]
name = "spaceshop-companion"
version = "0.5.3"
description = "Spaceshop Companion — contractor onboarding for Spaceshop projects"
authors = ["Spaceshop Studios"]
edition = "2021"

[lib]
name = "spaceshop_companion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

# ---- Dev-iteration speed tuning ----
# The big-binary link step dominates wall-time on every `tauri dev` restart.
# These profile tweaks shave ~50-70% off it on Windows MSVC:
#  - codegen-units=256 → more parallel codegen on a many-core CPU
#  - debug=line-tables-only on our crate → keep stack traces, lose locals
#  - debug=false on third-party crates → linker doesn't merge their PDBs
# (We still get full debuginfo when we explicitly build --release.)

[profile.dev]
codegen-units = 256
debug = "line-tables-only"
incremental = true

[profile.dev.package."*"]
opt-level = 0
debug = false

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-process = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "5"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_UI_Shell",
] }
