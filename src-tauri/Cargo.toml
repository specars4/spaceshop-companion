[package]
name = "spaceshop-companion"
version = "0.6.5"
description = "Spaceshop Companion — contractor onboarding for Spaceshop projects"
authors = ["Spaceshop Studios"]
edition = "2021"

[lib]
name = "spaceshop_companion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Tauri is pinned to 2.11.x. Do NOT auto-bump to 2.12+ without a sandbox
# test — Tauri issue #14614 reports a startup-hang regression on newer
# minors. Current installed: tauri 2.11.2, tauri-build 2.x matching.
[build-dependencies]
tauri-build = { version = "2.6", features = [] }

# ---- Dev-iteration speed tuning ----
# The big-binary link step dominates wall-time on every `tauri dev` restart.
# These profile tweaks shave ~50-70% off it on Windows MSVC:
#  - codegen-units=256 → more parallel codegen on a many-core CPU
#  - debug=line-tables-only on our crate → keep stack traces, lose locals
#  - debug=false on third-party crates → linker doesn't merge their PDBs
# (We still get full debuginfo when we explicitly build --release.)

[profile.dev]
codegen-units = 256
debug = "line-tables-only"
incremental = true

[profile.dev.package."*"]
opt-level = 0
debug = false

# Workaround for rustc + MSVC codegen crashes at opt-level=3 (seen as
# STATUS_ACCESS_VIOLATION and STATUS_STACK_BUFFER_OVERRUN during release
# builds). We hit this on the spaceshop-companion lib first (rustc 1.95),
# then again deterministically on the upstream `tauri` crate itself when
# building v0.6.0 with rustc 1.94. Same workaround works in both places:
# drop the crate's opt-level to 1 so rustc skips the LLVM pass that
# crashes. Runtime perf cost is imperceptible for a Tauri GUI app —
# there's no hot loop in our code or in tauri-core.
[profile.release.package.spaceshop-companion]
opt-level = 1

[profile.release.package.tauri]
opt-level = 1
codegen-units = 1

[dependencies]
tauri = { version = "2.11", features = ["tray-icon", "image-png"] }
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "5"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_UI_Shell",
    "Win32_Storage_FileSystem",
] }
